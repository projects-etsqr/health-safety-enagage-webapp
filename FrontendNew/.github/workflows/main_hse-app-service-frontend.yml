# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - hse-app-service-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install and build
        env:
          VITE_API_URL: https://hse-app-service-backend-eqc7ekghdngrgqgm.uksouth-01.azurewebsites.net/api/v1
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Prepare deploy package
        run: |
          mkdir -p deploy/dist
          cp -R dist/. deploy/dist/
          cp server.js deploy/server.js
          cp azure-package.json deploy/package.json
          ls -la deploy
          test -f deploy/dist/index.html
          test -f deploy/server.js
          test -f deploy/package.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy

      - name: Verify package contents
        run: |
          ls -la ./deploy
          test -f ./deploy/dist/index.html
          test -f ./deploy/server.js
          test -f ./deploy/package.json

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hse-app-service-frontend'
          slot-name: 'Production'
          package: ./deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E11AEE30AD91445195BDDD622C147E3B }}
